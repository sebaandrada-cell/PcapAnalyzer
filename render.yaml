# Render Blueprint — PcapAnalyzer hosted backend (FastAPI + tshark + queue worker).
#
# This file DOCUMENTS the live service `pcapanalyzer-api`, which was created by
# hand in the Render dashboard. It is not linked to a Blueprint instance, so
# editing it does not change the running service: change variables in
# Dashboard -> pcapanalyzer-api -> Environment. If you ever create a Blueprint
# instance from it, Render matches services by name and will start managing
# the live one, so review the values below first.
#
# Secrets are `sync: false`: they are never read from this file. Set them in
# the dashboard and never commit real values.
services:
  - type: web
    name: pcapanalyzer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # One process tree: the API (uvicorn on $PORT) plus the Supabase queue
    # worker. Overrides the Dockerfile CMD, which runs only the API.
    dockerCommand: python -m app.render_service
    plan: free                  # verify against the plan in the dashboard
    healthCheckPath: /health
    autoDeployTrigger: commit   # redeploy on push to the connected branch
    envVars:
      # ── Auth / data (Supabase) ─────────────────────────────────
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        value: https://pmmnobjhjfafgdccsywy.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false             # public key, but kept out of the repo
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false             # SECRET: bypasses RLS. Rotate if it ever leaks.
      # Postgres URI. REQUIRED in supabase mode (tenants, quotas, job queue).
      # Use the shared pooler in SESSION mode (aws-N-<region>.pooler.supabase.com
      # :5432, user postgres.<project-ref>): reachable over IPv4, whereas the
      # direct db.<ref> host is IPv6-only without the IPv4 add-on.
      - key: SUPABASE_DB_URL
        sync: false             # SECRET: contains the database password
      - key: SUPABASE_STORAGE_BUCKET
        value: pcap-captures
      # SUPABASE_JWT_SECRET is not needed: tokens are ES256 and verified
      # against the project's public JWKS.
      # ── CORS: exact origin match, no trailing slash, no wildcards ──
      - key: CORS_ORIGINS
        value: https://pcap-analyzer-seven.vercel.app
      # ── AI layer ───────────────────────────────────────────────
      # Demo mode simulates the diagnosis at zero cost. To use the real model,
      # remove LLM_DEMO and set ANTHROPIC_API_KEY (billed to your account per
      # diagnosis; set a spend limit in the Anthropic console first).
      - key: LLM_DEMO
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-4-8
      # ── Limits for the hosted beta (free-plan sized) ───────────
      # Keep MAX_UPLOAD_MB at or below the Storage bucket limit (200 MiB).
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_DECOMPRESSED_MB
        value: "100"
      - key: MAX_QUEUED_JOBS
        value: "2"
      - key: API_MAX_REQUESTS_PER_MINUTE
        value: "30"
      - key: API_MAX_JOBS_PER_TOKEN
        value: "1"
      # ── Abuse / cost guards (0 disables) ───────────────────────
      # Cloudflare edge + Render proxy append to X-Forwarded-For (checked in logs).
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: IP_MAX_REQUESTS_PER_MINUTE
        value: "120"
      - key: IP_MAX_UPLOADS_PER_MINUTE
        value: "6"
      # Hard daily ceilings on paid Anthropic calls (per tenant / whole service).
      - key: LLM_MAX_CALLS_PER_DAY
        value: "20"
      - key: LLM_MAX_CALLS_PER_DAY_GLOBAL
        value: "200"
