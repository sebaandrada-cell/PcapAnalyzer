# Builds the customer bundle exactly as scripts/build-release.sh does and runs
# it the way a buyer would: the shipped ./start.sh + docker compose, then HTTP
# checks through the real nginx proxy (see scripts/verify-bundle.sh).
#
# This covers what cannot be checked on a machine without Docker: the frontend
# image (Vite build + nginx), the compose wiring and the token/demo-mode flow.
name: Release bundle check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the customer bundle (fails on secrets or internal files)
        run: scripts/build-release.sh ci

      - name: Run the bundle like a buyer (start.sh + docker compose)
        run: scripts/verify-bundle.sh release/pcapanalyzer-ci.tar.gz
