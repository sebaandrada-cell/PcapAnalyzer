name: gitleaks

# Busca claves y contraseñas subidas por error. Sin push: los commits automáticos
# de datos no lo disparan. El escaneo semanal revisa todo el historial.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
