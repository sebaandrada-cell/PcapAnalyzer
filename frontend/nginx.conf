# Per-IP throttling for the self-hosted stack (bots, upload floods).
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container. Upload limit slightly above the
    # backend's MAX_UPLOAD_MB so the backend produces the friendly 413.
    location ~ ^/(analyze) {
        limit_req zone=upload burst=10 nodelay;
        limit_conn perip 4;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 250m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location ~ ^/(health|diagnose|query|report|jobs|sessions) {
        limit_req zone=api burst=20 nodelay;
        proxy_buffering off;  # /sessions/{id}/chat streams server-sent events
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 250m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
